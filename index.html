<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Fogón - Álbum Virtual</title>
    <link rel="icon" href="images/escudo1.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

            <div class="header">

            <img src="images/escudo1.png" class="escudo">

            <h1>EL FOGÓN</h1>

            <img src="images/escudo2.png" class="escudo">

            </div>

        <button id="mostrarSobres">
            Abrir Sobre
        </button>

        <button id="reiniciarAlbum">
        Reiniciar Álbum
        </button>

        <div class="navegacion">

            <button id="anterior">⬅</button>

            <span id="tituloPagina">
            Página 1
            </span>

            <button id="siguiente">➡</button>

        </div>

        <div id="mensajePegado" class="oculto">
        👆 Tocá las figuritas para pegarlas en el álbum
        </div>

        <div id="sobre"></div>

        <h2>Mi Colección</h2>

        <div class="libro">

            <div class="pagina-libro" id="paginaIzquierda"></div>

            <div class="centro-libro"></div>

             <div class="pagina-libro" id="paginaDerecha"></div>

        </div>

        <button id="verRepetidas">
    
            <div class="progreso-container">

                <div id="textoProgreso">
                    0 / 0
                </div>

                <div class="barra-fondo">

                    <div id="barraProgreso"></div>

                </div>

            </div>
    
            Repetidas
        </button>

        <div id="overlayRepetidas" class="overlay oculto">

            <div class="panel-repetidas">

                <h2>Mis Repetidas</h2>

                <div id="repetidas"></div>

            </div>

        </div>

        <div id="overlaySobres" class="overlay oculto">

            <div id="contenedorSobres"></div>

        </div>

        <div id="visorCarta" class="overlay oculto">

            <div class="carta-ampliada">

                <img id="imagenAmpliada">

            </div>

        </div>

        <script src="app.js"></script>

        <div id="flashLegendario"></div>
        
    </div>

</body>
</html>
